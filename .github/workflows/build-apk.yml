name: Build Al Habibi Feast APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      # ── Restore permanent keystore from secret ─────────────────────────────
      - name: Restore keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/keystore.jks
          echo "Keystore restored from secret"

      # ── Debug build ────────────────────────────────────────────────────────
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # ── Release APK + App Bundle ──────────────────────────────────────────
      - name: Build Release APK and Bundle
        env:
          KEYSTORE_PATH: keystore.jks
          KEYSTORE_PASS: AhfStore2024
          KEY_ALIAS: alhabibifeast
          KEY_PASS: AhfStore2024
        run: |
          ./gradlew assembleRelease
          ./gradlew bundleRelease

      # ── Upload artifacts ──────────────────────────────────────────────────
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AlHabibiFeast-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: AlHabibiFeast-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Upload App Bundle (Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: AlHabibiFeast-release-bundle
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Build summary
        run: |
          echo "✅ Build complete!"
          ls -lh app/build/outputs/apk/debug/ 2>/dev/null || true
          ls -lh app/build/outputs/apk/release/ 2>/dev/null || true
          ls -lh app/build/outputs/bundle/release/ 2>/dev/null || true
