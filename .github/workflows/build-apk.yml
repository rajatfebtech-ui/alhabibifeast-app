name: Build Al Habibi Feast APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      # ── Generate keystore ──────────────────────────────────────────────────
      - name: Generate release keystore
        run: |
          keytool -genkey -v \
            -keystore app/keystore.jks \
            -alias alhabibifeast \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "AhfStore2024" \
            -keypass "AhfStore2024" \
            -dname "CN=Al Habibi Feast,OU=App,O=AlHabibiFeast,L=Roorkee,ST=Uttarakhand,C=IN"
          echo "Keystore generated"

      # ── Debug build ────────────────────────────────────────────────────────
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # ── Release build ─────────────────────────────────────────────────────
      - name: Build Release APK
        env:
          KEYSTORE_PATH: keystore.jks
          KEYSTORE_PASS: AhfStore2024
          KEY_ALIAS: alhabibifeast
          KEY_PASS: AhfStore2024
        run: ./gradlew assembleRelease

      # ── Upload APKs ───────────────────────────────────────────────────────
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AlHabibiFeast-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload Release APK (Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: AlHabibiFeast-release-signed
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Build summary
        run: |
          echo "✅ Build complete!"
          ls -lh app/build/outputs/apk/debug/ 2>/dev/null || true
          ls -lh app/build/outputs/apk/release/ 2>/dev/null || true
