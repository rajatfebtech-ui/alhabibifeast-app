name: Generate Keystore (Run Once)

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore and print base64
        run: |
          keytool -genkey -v \
            -keystore release.jks \
            -alias alhabibifeast \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "AhfStore2024" \
            -keypass "AhfStore2024" \
            -dname "CN=Al Habibi Feast,OU=App,O=AlHabibiFeast,L=Roorkee,ST=Uttarakhand,C=IN"

          echo ""
          echo "====== COPY THIS ENTIRE BASE64 → Save as GitHub Secret: KEYSTORE_BASE64 ======"
          base64 -w 0 release.jks
          echo ""
          echo "==============================================================================="
          echo "KEYSTORE_PASS = AhfStore2024"
          echo "KEY_ALIAS     = alhabibifeast"
          echo "KEY_PASS      = AhfStore2024"
